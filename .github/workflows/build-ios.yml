# This workflow tries to build iOS app if any changes detected on the iOS source tree,
# ensuring at least it builds.

name: CI-iOS

on:
  push:
    branches: [master]
    paths:
      - 'ios/App'
      - package.json
  pull_request:
    branches: [master]
    paths:
      - 'ios/App'
      - package.json

env:
  CLOJURE_VERSION: '1.11.1.1413'
  NODE_VERSION: '22'
  JAVA_VERSION: '11'

permissions:
  contents: read

jobs:
  build-app:
    if: ${{ github.repository == 'gomons/logseq-og' && github.actor == 'gomons' && github.triggering_actor == 'gomons' }}
    timeout-minutes: 60
    runs-on: macos-13
    steps:
      - name: Check out Git repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn cache directory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Setup Java JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache clojure deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-lib-${{ hashFiles('**/deps.edn') }}

      - name: Setup clojure
        uses: DeLaGuardo/setup-clojure@1376ded6747c79645e82c856f16375af5f5de307 # 10.1
        with:
          cli: ${{ env.CLOJURE_VERSION }}

      - name: Set Build Environment Variables
        run: |
          echo "ENABLE_FILE_SYNC_PRODUCTION=true" >> $GITHUB_ENV

      - name: Compile CLJS
        run: yarn install --frozen-lockfile && yarn release-app

      - name: Sync static build files
        run: rsync -avz --exclude node_modules --exclude '*.js.map' --exclude android ./static/ ./public/static/

      - name: Prepare iOS build
        run: npx cap sync ios

      - name: List iOS build targets
        run: xcodebuild -list -workspace App.xcworkspace
        working-directory: ./ios/App

      - name: Build iOS App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme Logseq -destination generic/platform=iOS build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        working-directory: ./ios/App
