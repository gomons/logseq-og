name: logseq/db CI

on:
  # Path filters ensure jobs only kick off if a change is made to db
  push:
    branches: [master]
    paths:
      - 'deps/db/**'
      - '.github/workflows/db.yml'
      - '!deps/db/**.md'
  pull_request:
    branches: [master]
    paths:
      - 'deps/db/**'
      - '.github/workflows/db.yml'
      - '!deps/db/**.md'

defaults:
  run:
    working-directory: deps/db

env:
  CLOJURE_VERSION: '1.11.1.1413'
  JAVA_VERSION: '11'
  # This is the latest node version we can run.
  NODE_VERSION: '22'
  BABASHKA_VERSION: '1.0.168'

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.repository == 'gomons/logseq-og' && github.actor == 'gomons' && github.triggering_actor == 'gomons' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: deps/db/yarn.lock

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@1376ded6747c79645e82c856f16375af5f5de307 # 10.1
        with:
          cli: ${{ env.CLOJURE_VERSION }}
          bb: ${{ env.BABASHKA_VERSION }}

      - name: Fetch yarn deps
        run: yarn install --frozen-lockfile --frozen-lockfile

      # In this job because it depends on an npm package
      - name: Load namespaces into nbb-logseq
        run: bb test:load-all-namespaces-with-nbb .

  lint:
    if: ${{ github.repository == 'gomons/logseq-og' && github.actor == 'gomons' && github.triggering_actor == 'gomons' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@1376ded6747c79645e82c856f16375af5f5de307 # 10.1
        with:
          cli: ${{ env.CLOJURE_VERSION }}
          bb: ${{ env.BABASHKA_VERSION }}

      - name: Run clj-kondo lint
        run: clojure -M:clj-kondo --parallel --lint src

      - name: Carve lint for unused vars
        run: bb lint:carve 2>/dev/null

      - name: Lint for vars that are too large
        run: bb lint:large-vars 2>/dev/null

      - name: Lint datalog rules
        run: bb lint:rules

      - name: Lint for namespaces that aren't documented
        run: bb lint:ns-docstrings 2>/dev/null
